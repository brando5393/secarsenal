version: 1
frontend:
  phases:
    preBuild:
      commands:
        # Amplify's default image ships Node 22.18; astro 7.4+ needs >=22.23.4.
        - nvm install 22.23.4
        - nvm use 22.23.4
        - node -v
        - npm ci --cache .npm --prefer-offline
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - .npm/**/*
