customHeaders:
  - pattern: '**/*'
    headers:
      - key: 'Content-Security-Policy'
        value: "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'wasm-unsafe-eval'; object-src 'none'; base-uri 'self'; frame-ancestors 'none';"
      - key: 'X-Content-Type-Options'
        value: 'nosniff'
      - key: 'X-Frame-Options'
        value: 'DENY'
      - key: 'Referrer-Policy'
        value: 'strict-origin-when-cross-origin'
      - key: 'Permissions-Policy'
        value: 'geolocation=(), microphone=(), camera=()'
      - key: 'Strict-Transport-Security'
        value: 'max-age=63072000; includeSubDomains'
      # No "preload" directive — submitting to browsers' HSTS preload
      # list is effectively permanent (removal takes months even after
      # reverting this header), so that's a separate, later decision
      # once the domain/subdomain setup has proven stable. This
      # unpreloaded form is fully reversible: just change or remove the
      # header. See SECURITY.md.
