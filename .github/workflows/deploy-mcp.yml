name: Deploy MCP server

# Deploys mcp-server/ (a separate Cloudflare Worker, unrelated to the main
# Amplify-hosted site) whenever that directory changes on master. This is
# the repo's first workflow that deploys to a third party rather than just
# reading/building/opening a PR, so — like sync-tools.yml, the repo's other
# workflow that reaches outside GitHub — actions are pinned to a commit SHA
# rather than a floating tag.
on:
  push:
    branches: [master]
    paths: ["mcp-server/**", ".github/workflows/deploy-mcp.yml"]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp-server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: mcp-server/package-lock.json

      - run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      # Runtime (production) dependencies only: wrangler's own local-dev
      # toolchain (miniflare -> sharp) carries an advisory that never
      # ships in the deployed Worker bundle. Goes through the shared gate
      # (not a bare `npm audit`) so an advisory with no clean fix can be
      # accepted individually, with a reason and expiry, in
      # mcp-server/audit-allowlist.json. See mcp-server/README.md.
      - name: Audit production dependencies
        run: node ../scripts/audit-gate.mjs --omit-dev --allowlist=./audit-allowlist.json

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: mcp-server
