name: Sync Kali tools

# Regenerates the entire tools collection from Kali's own official
# tool pages (see scripts/sync-kali-tools.mjs) and opens a PR with the
# diff for human review. Never pushes straight to main — a bad parse
# or an unexpected page-structure change on kali.org should be caught
# by a reviewer, not published automatically.
on:
  schedule:
    - cron: "0 7 1 * *" # first of the month, 07:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci

      - name: Run Kali tools sync
        run: npm run sync-tools

      - name: Build to validate generated content
        run: npm run build

      - name: Open PR with regenerated tool entries
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "Sync tools collection from kali.org"
          title: "Scheduled sync: Kali tools collection"
          body: |
            Automated monthly sync of `src/content/tools/` from
            [kali.org's official tool pages](https://www.kali.org/tools/all-tools/)
            via `scripts/sync-kali-tools.mjs`.

            Review the diff before merging — check for unexpected mass
            deletions/changes that would indicate the page structure on
            kali.org changed in a way the parser didn't handle.
          branch: sync/kali-tools
          delete-branch: true
