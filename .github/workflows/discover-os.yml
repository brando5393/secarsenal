name: Discover new operating systems

# Checks Rawsec's CyberSecurity Inventory (an actively maintained,
# structured, MPL-2.0 catalog of pentest/security OSs) for any distro
# not already in src/content/os/, and opens a PR with a draft stub for
# each one found. Never edits or removes an existing OS entry, and
# never merges anything itself — a human fills in the fields the
# script had to guess (flagged with TODO comments) and decides whether
# the new distro is worth adding, same review gate as sync-tools.yml.
on:
  schedule:
    - cron: "0 8 1 * *" # first of the month, 08:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      # persist-credentials: false — actions/checkout's default of true
      # sets its own git-level auth header, which then collides with
      # peter-evans/create-pull-request's own token setup below
      # ("Duplicate header: Authorization", HTTP 400) at push time. This
      # combination is a known incompatibility between the two actions;
      # letting create-pull-request own the only auth header fixes it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci

      - name: Discover new OS entries
        run: npm run discover-os

      - name: Open PR with any drafted OS entries
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          commit-message: "Draft new OS entries discovered from Rawsec's CyberSecurity Inventory"
          title: "New OS candidates from Rawsec's CyberSecurity Inventory"
          body: |
            Automated discovery run against
            [Rawsec's CyberSecurity Inventory](https://github.com/noraj/rawsec-cybersecurity-inventory)'s
            maintained operating-systems list, via `scripts/discover-os.mjs`.

            Each drafted `src/content/os/*.md` file needs a human pass before
            merging:
            - `category` is a keyword guess (flagged with a `# TODO` comment) — verify it.
            - `gettingStarted` is a placeholder — write a real summary from the linked docs.
            - Decide whether this distro belongs on the site at all, and whether
              it has a genuine official tool listing worth a dedicated
              `scripts/sync-*.mjs` (leave `toolListMaintenance: manual` if not).
          branch: discover/os-candidates
          delete-branch: true
