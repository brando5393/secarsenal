name: Sync tools collection

# Regenerates the tools collection from each source's own official
# tool listing (Kali: scripts/sync-kali-tools.mjs, BlackArch:
# scripts/sync-blackarch-tools.mjs) and opens a PR with the diff for
# human review. Never pushes straight to main — a bad parse or an
# unexpected page-structure change on either site should be caught by
# a reviewer, not published automatically.
#
# Order matters: Kali runs first so its manifest (scripts/manifests/
# kali.json) is current before BlackArch's sync checks it to skip any
# tool Kali already covers.
on:
  schedule:
    - cron: "0 7 1 * *" # first of the month, 07:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    # BlackArch's sync verifies ~2,500 homepage links (network-bound,
    # not CPU/memory-heavy) and the tools collection is now large
    # enough that `npm run build` needs real memory headroom (already
    # set via NODE_OPTIONS in the build script itself) — give this
    # more room than the default job timeout assumption of "fast CI".
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci

      - name: Run Kali tools sync
        run: npm run sync-tools

      - name: Run BlackArch tools sync
        run: npm run sync-tools:blackarch

      - name: Build to validate generated content
        run: npm run build

      - name: Open PR with regenerated tool entries
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "Sync tools collection from kali.org and blackarch.org"
          title: "Scheduled sync: tools collection"
          body: |
            Automated monthly sync of `src/content/tools/` from
            [kali.org's official tool pages](https://www.kali.org/tools/all-tools/)
            and [blackarch.org's official tool table](https://blackarch.org/tools.html),
            via `scripts/sync-kali-tools.mjs` and `scripts/sync-blackarch-tools.mjs`.

            Review the diff before merging — check for unexpected mass
            deletions/changes that would indicate the page structure on
            either site changed in a way a parser didn't handle.
          branch: sync/tools
          delete-branch: true
