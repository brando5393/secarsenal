name: Sync tools collection

# Regenerates the tools collection from each source's own official
# tool listing (Kali: scripts/sync-kali-tools.mjs, BlackArch:
# scripts/sync-blackarch-tools.mjs, REMnux: scripts/sync-remnux-tools.mjs,
# Tails: scripts/sync-tails-tools.mjs, Security Onion:
# scripts/sync-security-onion-tools.mjs, ArchStrike:
# scripts/sync-archstrike-tools.mjs, FLARE VM:
# scripts/sync-flare-vm-tools.mjs, T-Pot: scripts/sync-tpot-tools.mjs)
# and opens a PR with the diff for human review. Never pushes straight
# to main — a bad parse or an
# unexpected page-structure change on any site should be caught by a
# reviewer, not published automatically.
#
# Order matters: each sync runs after the ones before it, so its
# manifest check (scripts/manifests/*.json) sees an up-to-date picture
# of which tools are already covered and skips them.
on:
  schedule:
    - cron: "0 7 1 * *" # first of the month, 07:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    # BlackArch's sync verifies ~2,500 homepage links and ArchStrike's
    # fetches a PKGBUILD per package (network-bound, not CPU/memory-
    # heavy), and the tools collection is now large enough that
    # `npm run build` needs real memory headroom (already set via
    # NODE_OPTIONS in the build script itself) — give this more room
    # than the default job timeout assumption of "fast CI".
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci

      - name: Run Kali tools sync
        run: npm run sync-tools

      - name: Run BlackArch tools sync
        run: npm run sync-tools:blackarch

      - name: Run REMnux tools sync
        run: npm run sync-tools:remnux

      - name: Run Tails tools sync
        run: npm run sync-tools:tails

      - name: Run Security Onion tools sync
        run: npm run sync-tools:security-onion

      - name: Run ArchStrike tools sync
        run: npm run sync-tools:archstrike

      - name: Run FLARE VM tools sync
        run: npm run sync-tools:flare-vm

      - name: Run T-Pot tools sync
        run: npm run sync-tools:tpot

      - name: Build to validate generated content
        run: npm run build

      - name: Open PR with regenerated tool entries
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "Sync tools collection from kali.org, blackarch.org, docs.remnux.org, tails.net, docs.securityonion.net, archstrike.org, mandiant/flare-vm, and telekom-security/tpotce"
          title: "Scheduled sync: tools collection"
          body: |
            Automated monthly sync of `src/content/tools/` from
            [kali.org's official tool pages](https://www.kali.org/tools/all-tools/),
            [blackarch.org's official tool table](https://blackarch.org/tools.html),
            [REMnux's official "Discover the Tools" docs](https://docs.remnux.org/discover-the-tools/analyze+documents),
            [Tails' official included-software page](https://tails.net/doc/about/features/index.en.html),
            [Security Onion's official tools docs](https://docs.securityonion.net/en/2.4/tools.html),
            [ArchStrike's official package table](https://archstrike.org/packages),
            [FLARE VM's own package list](https://github.com/mandiant/flare-vm/blob/main/config.xml),
            and [T-Pot's own "Honeypots and Tools" README section](https://github.com/telekom-security/tpotce#honeypots-and-tools),
            via `scripts/sync-kali-tools.mjs`, `scripts/sync-blackarch-tools.mjs`,
            `scripts/sync-remnux-tools.mjs`, `scripts/sync-tails-tools.mjs`,
            `scripts/sync-security-onion-tools.mjs`, `scripts/sync-archstrike-tools.mjs`,
            `scripts/sync-flare-vm-tools.mjs`, and `scripts/sync-tpot-tools.mjs`.

            Review the diff before merging — check for unexpected mass
            deletions/changes that would indicate the page structure on
            any of these sites changed in a way a parser didn't handle.
          branch: sync/tools
          delete-branch: true
